name: publish-npm

# Manual only — nothing is ever published to npm automatically.
# Requires an NPM_TOKEN secret (granular access token for the package).
# Run with dry_run=true (the default) to preview exactly what would ship.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual publish)"
        type: boolean
        default: true

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm run build

      - name: Dry-run publish
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
