name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Pack tarball
        run: |
          npm pack
          mv macro-pad-*.tgz macro-pad.tgz   # stable name for releases/latest/download/macro-pad.tgz

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: macro-pad-tarball
          path: "*.tgz"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tgz"
          generate_release_notes: true
