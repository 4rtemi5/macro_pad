<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262b37"/>
      <stop offset="0.55" stop-color="#181b23"/>
      <stop offset="1" stop-color="#101218"/>
    </linearGradient>
    <linearGradient id="capLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3a44"/>
      <stop offset="0.55" stop-color="#12242b"/>
      <stop offset="1" stop-color="#0d181d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="114" fill="#07080c"/>

  <!-- 2x2 keycap grid; bottom-right key is lit -->
  <g>
    <!-- key housings -->
    <rect x="88"  y="88"  width="136" height="136" rx="30" fill="#151821" stroke="#ffffff" stroke-opacity="0.05"/>
    <rect x="288" y="88"  width="136" height="136" rx="30" fill="#151821" stroke="#ffffff" stroke-opacity="0.05"/>
    <rect x="88"  y="288" width="136" height="136" rx="30" fill="#151821" stroke="#ffffff" stroke-opacity="0.05"/>
    <rect x="288" y="288" width="136" height="136" rx="30" fill="#151821" stroke="#ffffff" stroke-opacity="0.05"/>

    <!-- neon bleed under the lit key -->
    <circle cx="356" cy="356" r="104" fill="url(#glow)" filter="url(#soft)"/>

    <!-- cap tops -->
    <rect x="102" y="102" width="108" height="108" rx="22" fill="url(#cap)" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="302" y="102" width="108" height="108" rx="22" fill="url(#cap)" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="102" y="302" width="108" height="108" rx="22" fill="url(#cap)" stroke="#ffffff" stroke-opacity="0.09"/>
    <rect x="302" y="302" width="108" height="108" rx="22" fill="url(#capLit)" stroke="#22d3ee" stroke-opacity="0.65"/>

    <!-- lightning legend on the lit key -->
    <path d="M 368 318 L 334 358 L 353 358 L 343 396 L 381 350 L 360 350 Z"
          fill="#9be8ff" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
